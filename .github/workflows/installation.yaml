name: User installation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  PIP_NO_CACHE_DIR: '1'

jobs:
  install:
    name: ${{ matrix.manager }} / ${{ matrix.scenario }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        manager: [pip, uv]
        scenario: [default, combined-extras]
        include:
          - manager: pip
            python: '3.11'
          - manager: uv
            python: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the candidate wheel
        run: |
          python -m pip install uv
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
      # The wheel replaces the PyPI name "franken" in the documented commands.
      # No preinstalled torch, dependency overrides, or skipped synchronization.
      - name: Install in a fresh environment
        working-directory: ${{ runner.temp }}
        run: |
          wheel=("$RUNNER_TEMP"/wheels/franken-*.whl)
          package=${wheel[0]}
          if [ '${{ matrix.scenario }}' = combined-extras ]; then
            package+='[metatomic,torch-sim,docs,develop]'
          fi
          if [ '${{ matrix.manager }}' = pip ]; then
            python -m venv install-env
            install-env/bin/python -m pip install --upgrade pip
            install-env/bin/python -m pip install "$package"
          else
            uv init --bare --python '${{ matrix.python }}' uv-smoke
            cd uv-smoke
            uv venv --python '${{ matrix.python }}'
            uv add "$package"
          fi
      - name: Check dependencies, imports and MACE training
        env:
          FRANKEN_CACHE_DIR: ${{ runner.temp }}/franken-models
        working-directory: ${{ runner.temp }}
        run: |
          if [ '${{ matrix.manager }}' = pip ]; then
            install_python="$RUNNER_TEMP/install-env/bin/python"
          else
            install_python="$RUNNER_TEMP/uv-smoke/.venv/bin/python"
          fi
          uv pip check --python "$install_python"
          "$install_python" -c 'import mace'
          if [ '${{ matrix.scenario }}' = combined-extras ]; then
            "$install_python" -c 'import metatomic.torch, metatrain, torch_sim, sphinx, pytest'
          fi
          "$(dirname "$install_python")/franken.autotune" --dataset-name test \
            --backbone mace --mace.path-or-id mace_mp/small \
            --rf gaussian --gaussian.num-rf 16 --gaussian.length-scale 1 \
            --force-weight 0.5 --l2-penalty 0.0001 \
            --jac-chunk-size 2 --run-dir "$RUNNER_TEMP/training"
          test -n "$(find "$RUNNER_TEMP/training" -name best_ckpt.pt -print -quit)"
      - name: Add extras to the existing default installation
        if: matrix.scenario == 'default'
        working-directory: ${{ runner.temp }}
        run: |
          wheel=("$RUNNER_TEMP"/wheels/franken-*.whl)
          for extra in metatomic torch-sim docs develop; do
            if [ '${{ matrix.manager }}' = pip ]; then
              install-env/bin/python -m pip install "${wheel[0]}[$extra]"
              install_python="$RUNNER_TEMP/install-env/bin/python"
            else
              cd "$RUNNER_TEMP/uv-smoke"
              uv add --extra "$extra" "${wheel[0]}"
              install_python="$PWD/.venv/bin/python"
            fi
            uv pip check --python "$install_python"
          done
          "$install_python" -c 'import mace, metatomic.torch, metatrain, torch_sim, sphinx, pytest'
      - name: Resolve optional dependencies for each CUDA family
        if: matrix.scenario == 'combined-extras'
        run: |
          for cuda in 12 13; do
            uv pip compile pyproject.toml \
              --extra metatomic --extra torch-sim --extra docs --extra develop \
              --extra "cupy-cu$cuda" --extra "cueq-cu$cuda" \
              --python-version '${{ matrix.python }}' \
              --output-file "$RUNNER_TEMP/extras-cu$cuda.txt"
          done

  pytorch-build:
    name: ${{ matrix.manager }} / PyTorch ${{ matrix.build.index }} / ${{ matrix.build.extras }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        manager: [pip, uv]
        build:
          - index: cpu
            extras: metatomic,torch-sim
            cuda: ''
            torch: ''
          - index: cu128
            extras: cupy-cu12
            cuda: '12'
            torch: torch==2.11.0+cu128
          - index: cu128
            extras: cueq-cu12,cupy-cu12
            cuda: '12'
            torch: torch==2.11.0+cu128
          - index: cu130
            extras: cupy-cu13
            cuda: '13'
            torch: torch==2.14.1+cu130
          - index: cu130
            extras: cueq-cu13,cupy-cu13
            cuda: '13'
            torch: torch==2.14.1+cu130
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the candidate wheel
        run: |
          python -m pip install uv
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
      - name: Install with the selected PyTorch index
        working-directory: ${{ runner.temp }}
        env:
          TORCH_INDEX: https://download.pytorch.org/whl/${{ matrix.build.index }}
          TORCH_PACKAGE: ${{ matrix.build.torch }}
        run: |
          wheel=("$RUNNER_TEMP"/wheels/franken-*.whl)
          package="${wheel[0]}[${{ matrix.build.extras }}]"
          packages=("$package")
          if [ '${{ matrix.manager }}' = pip ]; then
            python -m venv install-env
            install-env/bin/python -m pip install --upgrade pip
            # Select the actual CUDA build; an extra index alone does not force it.
            if [ -n "$TORCH_PACKAGE" ]; then
              packages+=("$TORCH_PACKAGE")
            fi
            install-env/bin/python -m pip install --extra-index-url "$TORCH_INDEX" "${packages[@]}"
          else
            uv init --bare --python 3.13 uv-smoke
            cd uv-smoke
            uv venv --python 3.13
            # This is the same explicit index configuration shown in the docs.
            cat >> pyproject.toml <<TOML

          [[tool.uv.index]]
          name = "pytorch"
          url = "$TORCH_INDEX"
          explicit = true

          [tool.uv.sources]
          torch = { index = "pytorch" }
          TOML
            uv add 'torch>=2.5' "${packages[@]}"
          fi
      - name: Check installed packages and the selected build
        env:
          EXPECTED_CUDA: ${{ matrix.build.cuda }}
          EXPECTED_CUEQ: ${{ contains(matrix.build.extras, 'cueq-') }}
        working-directory: ${{ runner.temp }}
        run: |
          if [ '${{ matrix.manager }}' = pip ]; then
            install_python="$RUNNER_TEMP/install-env/bin/python"
          else
            install_python="$RUNNER_TEMP/uv-smoke/.venv/bin/python"
          fi
          uv pip check --python "$install_python"
          "$install_python" - <<'PY'
          import os
          import torch
          import mace
          from importlib.metadata import version
          expected = os.environ['EXPECTED_CUDA']
          if expected:
              assert torch.version.cuda and torch.version.cuda.split('.')[0] == expected, torch.version.cuda
              import cupy
              print(version('cupy-cuda' + expected + 'x'), cupy.__version__)
              if os.environ['EXPECTED_CUEQ'] == 'true':
                  import cuequivariance_torch
                  print(version('cuequivariance-ops-torch-cu' + expected))
          else:
              assert torch.version.cuda is None, torch.version.cuda
              import metatomic.torch, metatrain, torch_sim
          print(torch.__version__, torch.version.cuda)
          PY
          # These runners have no GPU. Kernel execution is deliberately not claimed.
