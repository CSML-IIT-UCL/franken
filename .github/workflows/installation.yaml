name: MACE installation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  install:
    name: Install and train (${{ matrix.manager }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: '3.11'
            manager: pip
          - python: '3.13'
            manager: uv
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build the package
        run: |
          python -m pip install uv
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
      - name: Install the default wheel with pip
        if: matrix.manager == 'pip'
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv pip-smoke
          pip-smoke/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip-smoke/bin/python -m pip install wheels/franken-*.whl
          pip-smoke/bin/python -m pip check
      - name: Add the default wheel to a uv project
        if: matrix.manager == 'uv'
        working-directory: ${{ runner.temp }}
        run: |
          uv init --bare --python '${{ matrix.python }}' uv-smoke
          cd uv-smoke
          uv venv --python '${{ matrix.python }}'
          uv add torch --index pytorch-cpu=https://download.pytorch.org/whl/cpu
          # Restrict this index to torch, so other packages come from PyPI.
          python -c "from pathlib import Path; p = Path('pyproject.toml'); p.write_text(p.read_text() + '\nexplicit = true\n')"
          uv add "$RUNNER_TEMP"/wheels/franken-*.whl
          uv pip check --python .venv/bin/python
      - name: Train using only the default installation
        env:
          FRANKEN_CACHE_DIR: ${{ runner.temp }}/franken-models
        working-directory: ${{ runner.temp }}
        run: |
          if [ '${{ matrix.manager }}' = pip ]; then
            TRAINER="$RUNNER_TEMP/pip-smoke/bin/franken.autotune"
          else
            TRAINER="$RUNNER_TEMP/uv-smoke/.venv/bin/franken.autotune"
          fi
          "$TRAINER" --dataset-name test \
            --backbone mace --mace.path-or-id mace_mp/small \
            --rf gaussian --gaussian.num-rf 16 --gaussian.length-scale 1 \
            --force-weight 0.5 --l2-penalty 0.0001 \
            --jac-chunk-size 2 --run-dir "$RUNNER_TEMP/training"
          test -n "$(find "$RUNNER_TEMP/training" -name best_ckpt.pt -print -quit)"
      - name: Resolve all extras with uv
        run: |
          uv pip compile pyproject.toml --all-extras \
            --python-version '${{ matrix.python }}' \
            --output-file "$RUNNER_TEMP/all-extras.txt"
      - name: Resolve extras with pip
        if: matrix.manager == 'pip'
        working-directory: ${{ runner.temp }}
        run: |
          wheel=(wheels/franken-*.whl)
          for cuda in cueq-cu12 cueq-cu13; do
            pip-smoke/bin/python -m pip install --dry-run \
              "${wheel[0]}[pet,metatomic,torch-sim,develop,docs,cuda,$cuda]"
          done
      - name: Add extras to a uv project without installing GPU wheels
        if: matrix.manager == 'uv'
        working-directory: ${{ runner.temp }}/uv-smoke
        run: |
          uv add --no-sync --extra pet --extra metatomic --extra torch-sim \
            --extra develop --extra docs --extra cuda --extra cueq-cu12 \
            "$RUNNER_TEMP"/wheels/franken-*.whl
