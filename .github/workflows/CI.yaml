name: CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    types: [opened, reopened, synchronize]
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  test:
    name: Py=${{ matrix.python-version }}, PT=${{ matrix.pytorch-version }}, OS=${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        pytorch-version: ["2.10"]
        # exclude:
        #   - python-version: "3.12"  # only to save CI minutes
        #     pytorch-version: "2.10"
    env:
      ENV_NAME: test_env
      PIP_CACHE_DIR: ~/.cache/pip
      ENV_PREFIX: ~/micromamba

    steps:
      - uses: actions/checkout@v7
      - name: Build information
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a
      # Cache 1: Conda environment. This caches the full dependency tree.
      - name: Cache conda environment
        id: cache-conda
        uses: actions/cache@v6
        with:
          path: ${{ env.ENV_PREFIX }}/envs
          key: micromamba-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ env.ENV_NAME }}-py${{ matrix.python-version }}-torch${{ matrix.pytorch-version }}-v1
      # Cache 2: pip wheels. These are not super important, only saves from downloading much stuff from PyPi.
      - name: Cache pip wheels
        id: cache-pip
        uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.pytorch-version }}-v1
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-torch${{ matrix.pytorch-version }}-
            pip-${{ runner.os }}-py${{ matrix.python-version }}-
      # Environment setup step
      - name: Setup python environment
        id: setup
        run: |
          chmod +x .github/install_cache.sh
          .github/install_cache.sh \
            --python "${{ matrix.python-version }}" \
            --pytorch "${{ matrix.pytorch-version }}" \
            --env-name "${{ env.ENV_NAME }}" \
            --pip-cache-dir "${{ env.PIP_CACHE_DIR }}" \
            --pip-install

      - name: Install franken package
        run: |
          eval "$(${{ env.MAMBA_EXE }} shell hook -s bash)"
          micromamba activate ${{ env.ENV_NAME }}
          python -m pip install .[develop,mace,pet]

      - name: Verify environment
        run: |
          eval "$(${{ env.MAMBA_EXE }} shell hook -s bash)"
          micromamba activate ${{ env.ENV_NAME }}
          
          echo "=== Python Information ==="
          python --version
          python -c "import sys; print(f'Python executable: {sys.executable}')"
          
          echo "=== PyTorch Information ==="
          python -c "import torch; print(f'PyTorch version: {torch.__version__}')"
          python -c "import torch; print(f'CUDA available: {torch.cuda.is_available()}')"
          
          echo "=== Installed Packages ==="
          micromamba list

      - name: Run tests
        run: |
          eval "$(${{ env.MAMBA_EXE }} shell hook -s bash)"
          micromamba activate ${{ env.ENV_NAME }}
          pytest -v --color=yes tests/

  build:
    name: Bump version and build package with hatch
    needs: test  # This ensures 'publish' only runs if 'test' passes
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@v7
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install hatch
        run: pip install hatch

      - name: Determine bump type
        id: bump
        run: |
          COMMIT_MSG=`git log -1 --pretty=%B | head -n 1`
          if [[ "$COMMIT_MSG" == *"[Major]"* ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif [[ "$COMMIT_MSG" == *"[Minor]"* ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
          fi
      - name: bump version and tag repo
        run: |
          git config --global user.name 'autobump'
          git config --global user.email 'autobump@github.com'
          OLD_VERSION=`hatch version`
          hatch version ${{ steps.bump.outputs.bump }}
          NEW_VERSION=`hatch version`
          git add franken/__init__.py
          git commit -m "Updated version: ${OLD_VERSION} → ${NEW_VERSION} [skip ci]"
          git tag $NEW_VERSION
          git push
          git push --tags
      - name: build franken package
        run: hatch build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/*

  publish:
    name: Publish to PyPi
    needs: build
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build.result == 'success'
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/project/franken/
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1