name: Docs

# Runs on pushes targeting the default branch
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Cancel in-progress runs when pushing a new commit on the PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs:
    environment:  # for deployment to pages only!
      name: ghpg
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ENV_NAME: readthedocs
      PYTHON_VERSION: 3.12
      PYTORCH_VERSION: 2.10
      ENV_PREFIX: ~/micromamba
      PIP_CACHE_DIR: ~/.cache/pip
      CONDA_ARGS: pandoc=3.6.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cache 1: Conda environment. This caches the full dependency tree.
      - name: Cache conda environment
        id: cache-conda
        uses: actions/cache@v6
        with:
          path: ${{ env.ENV_PREFIX }}/envs
          key: micromamba-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ env.ENV_NAME }}-py${{ env.PYTHON_VERSION }}-torch${{ env.PYTORCH_VERSION }}-v1
      # Cache 2: pip wheels. These are not super important, only saves from downloading much stuff from PyPi.
      - name: Cache pip wheels
        id: cache-pip
        uses: actions/cache@v6
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-torch${{ env.PYTORCH_VERSION }}-v1
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-torch${{ env.PYTORCH_VERSION }}-
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-
      # Environment setup step
      - name: Setup python environment
        id: setup
        run: |
          chmod +x .github/install_cache.sh
          .github/install_cache.sh \
            --python ${{ env.PYTHON_VERSION }} \
            --pytorch ${{ env.PYTORCH_VERSION }} \
            --pip-cache-dir ${{ env.PIP_CACHE_DIR }} \
            --env-name ${{ env.ENV_NAME }} \
            --conda-create-args ${{ env.CONDA_ARGS }} \
            --pip-install

      - name: Install franken package
        run: |
          eval "$(${{ env.MAMBA_EXE }} shell hook -s bash)"
          micromamba activate ${{ env.ENV_NAME }}
          python -m pip install .[develop,mace,pet,docs]

      - name: Verify environment
        run: |
          eval "$(${{ env.MAMBA_EXE }} shell hook -s bash)"
          micromamba activate ${{ env.ENV_NAME }}
          echo "=== Python Information ==="
          python --version
          python -c "import sys; print(f'Python executable: {sys.executable}')"
          echo "=== Installed Packages ==="
          micromamba list

      - name: Sphinx build
        run: |
          eval "$(${{ env.MAMBA_EXE }} shell hook -s bash)"
          micromamba activate ${{ env.ENV_NAME }}
          # Check import works. sphinx-build will try to import but not provide reliable error-traces.
          python -c "import franken; import franken.calculators;"
          sphinx-build docs _build

      # This step zips and pushes the built docs to the rtd branch
      - name: Push docs to rtd branch
        if: github.ref == 'refs/heads/main'  # Only deploy when pushing to main
        run: |
          # Setup git identity
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Create docs.zip from the _build directory first
          cd _build
          zip -r ../docs.zip .
          cd ..

          # Save a copy of important files
          cp .readthedocs.yaml /tmp/readthedocs.yaml
          cp docs.zip /tmp/docs.zip

          # Create a fresh rtd branch
          git checkout --orphan rtd-temp
          git rm -rf .

          # Restore the saved files
          cp /tmp/readthedocs.yaml .readthedocs.yaml
          cp /tmp/docs.zip docs.zip

          # Add and commit both files
          git add docs.zip .readthedocs.yaml
          git commit -m "Update documentation build [skip ci]"

          # Force push to rtd branch
          git push origin rtd-temp:rtd -f
